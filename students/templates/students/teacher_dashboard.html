<!DOCTYPE html>
<html>
<head>
    <title>Teacher Dashboard</title>
</head>
<body>
    <h1>Welcome, {{ teacher.name }}!</h1>
    <h2>Your Assigned Classrooms:</h2>
    {% if assigned_classrooms %}
        <ul>
            {% for classroom in assigned_classrooms %}
                <li><a href="{% url 'mark_attendance' classroom.id %}">{{ classroom.name }}</a></li>
            {% endfor %}
        </ul>
    {% else %}
        <p>You are not assigned to any classrooms.</p>
    {% endif %}
</body>
</html>
